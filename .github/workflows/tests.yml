name: Tests

on:
  push:
    branches:
      - develop
      - master
      - "feature/*"
      - "release/*"
      - "hotfix/*"
  pull_request:
    branches:
      - develop
      - master

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: [3.12]

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install --no-cache-dir --upgrade -r requirements.txt; fi

      - name: Debug installed versions
        run: |
          echo "=== pybatteryid ==="
          pip show pybatteryid
          echo ""
          echo "=== Available versions on PyPI ==="
          pip index versions pybatteryid || true
          echo ""
          echo "=== Full pip freeze ==="
          pip freeze
          echo ""
          echo "=== Import check ==="
          python -c "import pybatteryid; print('Module path:', pybatteryid.__file__); print('Version:', getattr(pybatteryid, '__version__', 'no __version__ attribute'))"

      - name: Install package
        run: |
          pip install -e .

      - name: Run tests
        run: pytest -q
